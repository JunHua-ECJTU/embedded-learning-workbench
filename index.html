<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="配合嵌入式学习计划使用的本地任务、进度、笔记、里程碑与复盘工作台。">
  <meta name="theme-color" content="#14161a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230d7a5f'/%3E%3Cpath%20d='M6%2020h5v-7h5v4h5V8h5'%20fill='none'%20stroke='%23fff'%20stroke-width='2.5'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3C/svg%3E">
  <title>嵌入式学习工作台</title>
  <script>
    (function () {
      var theme = null;
      try {
        var storedTheme = localStorage.getItem('emb-wb:theme');
        if (storedTheme === null) storedTheme = localStorage.getItem('embedded-plan-theme');
        theme = storedTheme === null ? null : JSON.parse(storedTheme);
      } catch (error) {}
      document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
    }());
  </script>
  <style>
    /*
      Embedded design contract
      Atmosphere: a quiet firmware command surface with circuit-board precision.
      References: the companion learning plan's emerald identity and Linear's tonal depth.
      Layout: one bounded shell, fixed navigation, one main scroll owner.
      Primitives: button, field, tag, card, list row, progress track, empty state.
      Accessibility: WCAG 2.2 AA intent, visible focus, 44px mobile targets, reduced motion.
    */
    :root {
      color-scheme: light;
      --bg: #f5f4ef;
      --sidebar: #eeece6;
      --surface: #ffffff;
      --surface-raised: #fafaf7;
      --surface-muted: #e9e7e1;
      --text: #202623;
      --text-soft: #5f6863;
      --text-faint: #626963;
      --line: #d9d8d1;
      --line-strong: #c7c9c2;
      --accent: #0d7a5f;
      --accent-hover: #08634d;
      --accent-ink: #f4fff9;
      --accent-soft: #dcefe8;
      --accent-line: #9fcdbd;
      --danger: #b33b45;
      --danger-soft: #f6e3e5;
      --warning: #9a6212;
      --warning-soft: #f6ead6;
      --info: #356a8a;
      --info-soft: #e0edf4;
      --low: #69736e;
      --low-soft: #e8ebe9;
      --cat-c: #0d7a5f;
      --cat-c-bg: #dcefe8;
      --cat-stm: #356a8a;
      --cat-stm-bg: #e0edf4;
      --cat-rtos: #7b5c9c;
      --cat-rtos-bg: #ede6f4;
      --cat-linux: #9a6212;
      --cat-linux-bg: #f6ead6;
      --cat-circuit: #a24550;
      --cat-circuit-bg: #f6e3e5;
      --cat-other: #69736e;
      --cat-other-bg: #e8ebe9;
      --shadow-1: 0 1px 2px rgba(25, 44, 36, 0.06), 0 8px 22px rgba(25, 44, 36, 0.05);
      --shadow-2: 0 12px 32px rgba(25, 44, 36, 0.14);
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-12: 48px;
      --radius-field: 6px;
      --radius-card: 8px;
      --touch: 44px;
      --sidebar-wide: 264px;
      --sidebar-rail: 120px;
      --content-pad: 32px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --text-xs: 12px;
      --text-sm: 14px;
      --text-md: 16px;
      --text-lg: 18px;
      --text-xl: 24px;
      --text-2xl: 32px;
      --motion-fast: 120ms;
      --motion-standard: 220ms;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #14161a;
      --sidebar: #111317;
      --surface: #1b1e23;
      --surface-raised: #20242a;
      --surface-muted: #262a31;
      --text: #e8ecea;
      --text-soft: #a8b0ac;
      --text-faint: #a0aaa3;
      --line: #2d3239;
      --line-strong: #3a4149;
      --accent: #34d399;
      --accent-hover: #6ee7b7;
      --accent-ink: #0b1512;
      --accent-soft: rgba(52, 211, 153, 0.12);
      --accent-line: rgba(52, 211, 153, 0.32);
      --danger: #f1848e;
      --danger-soft: rgba(241, 132, 142, 0.12);
      --warning: #e7b55f;
      --warning-soft: rgba(231, 181, 95, 0.12);
      --info: #79b7dc;
      --info-soft: rgba(121, 183, 220, 0.12);
      --low: #a2aaa6;
      --low-soft: rgba(162, 170, 166, 0.1);
      --cat-c: #56d9a6;
      --cat-c-bg: rgba(86, 217, 166, 0.12);
      --cat-stm: #83c4e8;
      --cat-stm-bg: rgba(131, 196, 232, 0.12);
      --cat-rtos: #c3a0e6;
      --cat-rtos-bg: rgba(195, 160, 230, 0.12);
      --cat-linux: #e6b86a;
      --cat-linux-bg: rgba(230, 184, 106, 0.12);
      --cat-circuit: #ed9099;
      --cat-circuit-bg: rgba(237, 144, 153, 0.12);
      --cat-other: #a8b0ac;
      --cat-other-bg: rgba(168, 176, 172, 0.1);
      --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.24), 0 12px 28px rgba(0, 0, 0, 0.16);
      --shadow-2: 0 18px 44px rgba(0, 0, 0, 0.34);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 0; overflow: hidden; }
    html { block-size: 100%; }
    body {
      block-size: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; }
    button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    a { color: inherit; }
    svg { display: block; }
    .icon { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon-lg { width: 22px; height: 22px; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .skip-link {
      position: fixed;
      inset: var(--space-2) auto auto var(--space-2);
      z-index: 100;
      transform: translateY(-160%);
      background: var(--accent);
      color: var(--accent-ink);
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-field);
      font-weight: 700;
    }
    .skip-link:focus { transform: translateY(0); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    ::selection { background: var(--accent-soft); }

    .app-shell {
      display: grid;
      grid-template-columns: var(--sidebar-wide) minmax(0, 1fr);
      block-size: 100dvh;
      overflow: hidden;
    }
    .sidebar {
      min-block-size: 0;
      overflow-y: auto;
      background: var(--sidebar);
      border-inline-end: 1px solid var(--line);
      padding: var(--space-4) var(--space-3);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-width: 0;
      padding: var(--space-2);
      color: var(--text);
      text-decoration: none;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-card);
      display: grid;
      place-items: center;
      color: var(--accent-ink);
      background: var(--accent);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
      flex: none;
    }
    .brand-copy { min-width: 0; }
    .brand-copy strong { display: block; font-size: var(--text-md); line-height: 1.25; white-space: nowrap; }
    .brand-copy small { display: block; margin-top: var(--space-1); color: var(--text-faint); font-family: var(--font-mono); font-size: var(--text-xs); white-space: nowrap; }
    .sidebar-nav { display: grid; gap: var(--space-1); }
    .nav-link {
      min-height: var(--touch);
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-3);
      color: var(--text-soft);
      text-decoration: none;
      border-radius: var(--radius-field);
      font-weight: 600;
      position: relative;
    }
    .nav-link:hover { background: var(--surface-muted); color: var(--text); }
    .nav-link[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
    .nav-link[aria-current="page"]::before {
      content: "";
      position: absolute;
      inset-block: 10px;
      inset-inline-start: 0;
      width: 3px;
      border-radius: 99px;
      background: var(--accent);
    }
    .nav-label { white-space: nowrap; }
    .sidebar-spacer { flex: 1; }
    .sidebar-tools { border-top: 1px solid var(--line); padding-top: var(--space-3); display: grid; gap: var(--space-1); }
    .tool-button, .tool-link {
      width: 100%;
      min-height: var(--touch);
      border: 0;
      border-radius: var(--radius-field);
      background: transparent;
      color: var(--text-soft);
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-3);
      text-decoration: none;
      cursor: pointer;
      text-align: start;
    }
    .tool-button:hover, .tool-link:hover { background: var(--surface-muted); color: var(--text); }
    .tool-button.danger:hover { color: var(--danger); background: var(--danger-soft); }
    .sidebar-details summary { list-style: none; }
    .sidebar-details summary::-webkit-details-marker { display: none; }
    .sidebar-details[open] > summary { color: var(--accent); background: var(--surface-muted); }
    .sidebar-details-panel { display: grid; gap: var(--space-1); margin-top: var(--space-1); padding-inline-start: var(--space-3); }
    .sidebar-details-panel .tool-button { font-size: var(--text-xs); }
    .local-note { color: var(--text-faint); font-size: var(--text-xs); padding: var(--space-2) var(--space-3) 0; overflow-wrap: anywhere; }
    .collapse-button { justify-content: center; border: 1px solid var(--line); background: var(--surface); }

    .workspace { min-width: 0; min-height: 0; overflow-x: hidden; overflow-y: auto; scroll-behavior: smooth; }
    .mobile-topbar, .mobile-bottom-nav { display: none; }
    .view { width: 100%; padding: var(--content-pad); }
    .view-inner { width: 100%; max-width: 1540px; margin-inline: auto; }
    .view-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: var(--space-6);
      margin-bottom: var(--space-8);
    }
    .view-heading { min-width: 0; }
    .view-kicker { color: var(--accent); font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 700; margin: 0 0 var(--space-2); }
    .view-title { margin: 0; font-size: var(--text-2xl); line-height: 1.2; letter-spacing: 0; }
    .view-description { margin: var(--space-2) 0 0; color: var(--text-soft); font-size: var(--text-md); max-width: 68ch; overflow-wrap: anywhere; }
    .view-context { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; justify-content: flex-end; }
    .date-chip { color: var(--text-soft); font-family: var(--font-mono); font-size: var(--text-xs); border: 1px solid var(--line); padding: var(--space-2) var(--space-3); border-radius: 999px; background: var(--surface); white-space: nowrap; }

    .button {
      min-height: 40px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-field);
      background: var(--surface-raised);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-4);
      cursor: pointer;
      text-decoration: none;
      font-weight: 700;
      white-space: nowrap;
      transition: transform var(--motion-fast) ease, border-color var(--motion-fast) ease, background var(--motion-fast) ease;
    }
    .button:hover { border-color: var(--accent-line); background: var(--surface-muted); }
    .button:active { transform: scale(0.97); }
    .button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .button.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
    .button.primary:hover { background: var(--accent-hover); }
    .button.ghost { background: transparent; }
    .button.danger { color: var(--danger); }
    .button.small { min-height: 34px; padding: var(--space-1) var(--space-3); font-size: var(--text-xs); }
    .icon-button { width: 36px; min-width: 36px; height: 36px; min-height: 36px; padding: 0; }

    .field, select.field, textarea.field {
      width: 100%;
      min-width: 0;
      min-height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-field);
      background: var(--surface-raised);
      color: var(--text);
      padding: 9px var(--space-3);
    }
    textarea.field { min-height: 104px; resize: vertical; line-height: 1.6; }
    .field::placeholder { color: var(--text-faint); }
    .field:focus { border-color: var(--accent); outline: 2px solid var(--accent-soft); outline-offset: 1px; }
    .form-label { display: grid; gap: var(--space-2); color: var(--text-soft); font-weight: 700; }
    .form-hint { font-size: var(--text-xs); color: var(--text-faint); font-weight: 400; }
    .quick-form { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .quick-form .grow { flex: 1 1 280px; }
    .quick-form .compact { flex: 0 1 150px; }
    .form-section-heading { margin-bottom: var(--space-4); }
    .form-section-heading h2 { margin: 0; font-size: var(--text-lg); }
    .form-section-heading p { margin: var(--space-1) 0 0; color: var(--text-soft); }
    .task-create-form { display: grid; grid-template-columns: minmax(200px, 1fr) 120px 160px 160px auto; gap: var(--space-3); align-items: end; }
    .note-create-form { display: grid; grid-template-columns: 150px 190px minmax(280px, 1fr) auto; gap: var(--space-3); align-items: end; }
    .field-label { display: grid; gap: var(--space-2); min-width: 0; color: var(--text-soft); font-size: 13px; font-weight: 700; }
    .field-label .field { font-size: var(--text-sm); font-weight: 400; }

    .card {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-1);
      padding: var(--space-5);
      overflow-wrap: anywhere;
    }
    .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-4); }
    .card-title { margin: 0; font-size: var(--text-lg); line-height: 1.35; }
    .card-description { margin: var(--space-1) 0 0; color: var(--text-soft); }
    .section-title { margin: 0 0 var(--space-4); font-size: var(--text-xl); }
    .meta-row { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
    .tag { display: inline-flex; align-items: center; min-height: 24px; padding: 2px var(--space-2); border-radius: 999px; border: 1px solid var(--line); color: var(--text-soft); background: var(--surface-raised); font-size: var(--text-xs); font-weight: 700; white-space: nowrap; }
    .tag.phase { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); font-family: var(--font-mono); }
    .tag.high { color: var(--danger); border-color: transparent; background: var(--danger-soft); }
    .tag.medium { color: var(--warning); border-color: transparent; background: var(--warning-soft); }
    .tag.low { color: var(--low); border-color: transparent; background: var(--low-soft); }
    .tag.today { color: var(--info); border-color: transparent; background: var(--info-soft); }
    .tag.overdue { color: var(--danger); border-color: transparent; background: var(--danger-soft); }
    .tag.current { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
    .tag.passed { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
    .tag.cat-c { color: var(--cat-c); background: var(--cat-c-bg); border-color: transparent; }
    .tag.cat-stm32 { color: var(--cat-stm); background: var(--cat-stm-bg); border-color: transparent; }
    .tag.cat-rtos { color: var(--cat-rtos); background: var(--cat-rtos-bg); border-color: transparent; }
    .tag.cat-linux { color: var(--cat-linux); background: var(--cat-linux-bg); border-color: transparent; }
    .tag.cat-circuit { color: var(--cat-circuit); background: var(--cat-circuit-bg); border-color: transparent; }
    .tag.cat-other { color: var(--cat-other); background: var(--cat-other-bg); border-color: transparent; }

    .home-grid { display: grid; grid-template-columns: minmax(0, 7fr) minmax(300px, 4fr); gap: var(--space-4); align-items: start; }
    .today-card {
      position: relative;
      overflow: hidden;
      padding: var(--space-6);
      border-color: var(--accent-line);
      background-color: var(--surface);
      background-image: linear-gradient(var(--accent-soft) 1px, transparent 1px), linear-gradient(90deg, var(--accent-soft) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    .today-card::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, transparent, var(--surface) 82%); opacity: 0.7; }
    .today-card > * { position: relative; z-index: 1; }
    .daily-quote { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2); margin-top: var(--space-5); color: var(--text-soft); font-size: var(--text-sm); }
    .daily-quote blockquote { margin: 0; }
    .daily-quote cite { font-style: normal; font-size: 13px; }
    .today-card .section-title { margin-bottom: var(--space-1); }
    .today-card .card-header { align-items: center; }
    .today-actions { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--line); }
    .side-stack { display: grid; gap: var(--space-4); }
    .quick-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); margin-top: var(--space-4); }
    .focus-entry { border-inline-start: 3px solid var(--accent); }
    .focus-entry .card-description { max-width: 52ch; }
    .focus-task-link { margin-top: var(--space-3); }
    .focus-layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(320px, .85fr); gap: var(--space-4); align-items: start; }
    .focus-card { text-align: center; }
    .focus-modes { display: flex; justify-content: center; gap: var(--space-1); flex-wrap: wrap; margin-bottom: var(--space-6); }
    .focus-modes button { min-height: 40px; border: 1px solid var(--line); border-radius: var(--radius-field); background: transparent; color: var(--text-soft); padding: var(--space-2) var(--space-4); cursor: pointer; font-weight: 700; }
    .focus-modes button.active { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent); }
    .focus-mode-label { margin: 0; color: var(--accent); font-family: var(--font-mono); font-size: var(--text-sm); font-weight: 700; }
    .focus-clock { margin: var(--space-5) 0 var(--space-6); }
    .focus-clock strong { display: block; margin-top: var(--space-2); color: var(--text); font: 700 88px/1 var(--font-mono); letter-spacing: 0; }
    .focus-clock p { margin: var(--space-3) 0 0; color: var(--text-soft); }
    .focus-actions { display: flex; justify-content: center; gap: var(--space-2); }
    .focus-status { min-height: 24px; margin: var(--space-4) 0 0; color: var(--text-faint); font-size: var(--text-xs); }
    .focus-guide ol { margin: 0; padding-inline-start: var(--space-5); color: var(--text-soft); }
    .focus-guide li + li { margin-top: var(--space-3); }
    .focus-guide strong { color: var(--text); }
    .progress-track { height: 8px; overflow: hidden; border-radius: 99px; background: var(--surface-muted); }
    .progress-fill { display: block; width: var(--progress, 0%); height: 100%; border-radius: inherit; background: var(--accent); transition: width var(--motion-standard) ease; }
    .progress-summary { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-3); }
    .progress-value { color: var(--accent); font: 700 var(--text-xl)/1 var(--font-mono); }
    .support-link { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); color: var(--text); text-decoration: none; }
    .support-link:hover { color: var(--accent); }
    .milestone-focus { border-inline-start: 3px solid var(--accent); }

    .task-list { list-style: none; margin: 0; padding: 0; display: grid; }
    .task-row { min-width: 0; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-3); align-items: center; padding: var(--space-3) 0; border-bottom: 1px solid var(--line); }
    .task-row:last-child { border-bottom: 0; }
    .task-row.is-done .task-title { color: var(--text-faint); text-decoration: line-through; }
    .task-check { position: relative; width: 24px; height: 24px; }
    .task-check input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; cursor: pointer; }
    .task-check span { display: grid; place-items: center; width: 24px; height: 24px; border: 1px solid var(--line-strong); border-radius: var(--radius-field); background: var(--surface-raised); color: var(--accent-ink); }
    .task-check input:checked + span { background: var(--accent); border-color: var(--accent); }

      const store = Object.freeze({
        get(name, fallback) {
          try {
            const raw = localStorage.getItem(PREFIX + name);
            return raw === null ? fallback : JSON.parse(raw);
          } catch (error) {
            return fallback;
          }
        },
        set(name, value) {
          try {
            localStorage.setItem(PREFIX + name, JSON.stringify(value));
            return true;
          } catch (error) {
            return false;
          }
        },
        remove(name) {
          localStorage.removeItem(PREFIX + name);
        }
      });

      function localDate(date = new Date()) {
        const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
        return local.toISOString().slice(0, 10);
      }

      function createTimer(mode = 'focus') {
        return { mode, remaining: TIMER_MODES[mode].seconds, running: false, updatedAt: Date.now(), endsAt: null, sessions: 0 };
      }

      function normalizeTimer(value) {
        const mode = value && TIMER_MODES[value.mode] ? value.mode : 'focus';
        const total = TIMER_MODES[mode].seconds;
        const now = Date.now();
        let remaining = Number.isFinite(Number(value?.remaining)) ? Math.max(0, Math.min(total, Number(value.remaining))) : total;
        let running = value?.running === true;
        const updatedAt = Number(value?.updatedAt) || now;
        let endsAt = Number.isFinite(Number(value?.endsAt)) ? Number(value.endsAt) : null;
        if (running) {
          if (endsAt === null) {
            remaining = Math.max(0, remaining - Math.floor((now - updatedAt) / 1000));
            endsAt = now + remaining * 1000;
          } else {
            remaining = Math.max(0, Math.min(total, Math.ceil((endsAt - now) / 1000)));
          }
          running = remaining > 0;
        }
        return { mode, remaining, running, updatedAt: now, endsAt: running ? endsAt : null, sessions: Math.max(0, Number(value?.sessions) || 0) };
      }

      function persistTimer() {
        store.set('timer', timer);
      }

      function quoteForToday() {
        const key = localDate();
        const hash = Array.from(key).reduce((sum, char) => sum + char.charCodeAt(0), 0);
        return DAILY_QUOTES[hash % DAILY_QUOTES.length];
      }

      function formatTimer(seconds) {
        const minutes = Math.floor(seconds / 60).toString().padStart(2, '0');
        const remainder = (seconds % 60).toString().padStart(2, '0');
        return minutes + ':' + remainder;
      }

      function weekLabel(date = new Date()) {
        const working = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
        const day = working.getUTCDay() || 7;
        working.setUTCDate(working.getUTCDate() + 4 - day);
        const yearStart = new Date(Date.UTC(working.getUTCFullYear(), 0, 1));
        const week = Math.ceil((((working - yearStart) / 86400000) + 1) / 7);
        return working.getUTCFullYear() + '-W' + String(week).padStart(2, '0');
      }

      function createStages(seeded) {
        return [
          { id: 'P0', name: '筑基', range: 'M1-M2 · 第1-10周', weight: 10, focus: '练熟 C 语言指针与内存，手写常用数据结构，并看懂基础电路图', progress: seeded ? 65 : 0, progressMode: 'auto', next: '今天完成 10 道指针与内存练习，订正错题后手写单链表的插入和删除。' },
          { id: 'P1', name: '单片机实战', range: 'M3-M7 · 第11-18周', weight: 8, focus: '用 STM32 独立完成 GPIO、中断、串口、定时器、PWM 和 ADC 实验', progress: seeded ? 20 : 0, progressMode: 'auto', next: '新建 STM32 空工程，让 LED 闪烁，再加入按键中断并用串口打印触发次数。' },
          { id: 'P2', name: 'RTOS 工程化', range: 'M7-M9 · 第19-22周', weight: 4, focus: '用 FreeRTOS 完成多任务、队列、信号量和互斥量实验，并按规范组织 C 工程', progress: 0, progressMode: 'auto', next: '创建两个 FreeRTOS 任务，让任务 A 每秒通过队列向任务 B 发送一个递增数字。' },
          { id: 'P3', name: '嵌入式 Linux', range: 'M9-M15 · 第23-34周', weight: 12, focus: '在开发板运行 Linux，完成进程、文件、Socket 和基础驱动实验', progress: 0, progressMode: 'auto', next: '在 Linux 开发板上编写并运行一个 TCP 服务端和客户端，互相发送一条文本消息。' },

      }

      function createSeed() {
        const today = localDate();
        const previousWeek = new Date();
        previousWeek.setDate(previousWeek.getDate() - 7);
        return {
          tasks: [
            { id: 'task-pointer', title: UPDATED_SAMPLE_TASKS['指针与内存练习题 20 道'], priority: 'high', phase: 'P0', done: false, scheduledFor: today, createdAt: today, completedAt: null },
            { id: 'task-gpio', title: UPDATED_SAMPLE_TASKS['STM32 GPIO 与中断实验'], priority: 'medium', phase: 'P1', done: false, scheduledFor: today, createdAt: today, completedAt: null },
            { id: 'task-list', title: UPDATED_SAMPLE_TASKS['整理链表与队列笔记'], priority: 'low', phase: 'P0', done: false, scheduledFor: today, createdAt: today, completedAt: null },
            { id: 'task-circuit', title: UPDATED_SAMPLE_TASKS['复习上拉电阻与去耦电容'], priority: 'medium', phase: 'P0', done: true, scheduledFor: today, createdAt: today, completedAt: new Date().toISOString() }
          ],
          stages: createStages(true),
          notes: [
            { id: 'note-pointer', category: 'C语言', phase: 'P0', content: '指针加一移动的是所指类型的字节数，不一定是一个字节。检查数组越界时要同时看元素个数和指针类型。', createdAt: new Date().toISOString() },
            { id: 'note-pwm', category: 'STM32', phase: 'P1', content: 'PWM 实验：固定计数周期后，占空比由比较值决定。改频率时要同时核对时钟源、预分频和自动重装值。', createdAt: new Date(Date.now() - 3600000).toISOString() },
            { id: 'note-circuit', category: '电路', phase: 'P0', content: '按键输入悬空会产生随机电平；内部上下拉能稳定默认状态，长线仍需关注干扰与硬件滤波。', createdAt: new Date(Date.now() - 86400000).toISOString() }
          ],
          milestones: createMilestones(true),
          reviews: [
            { id: 'review-sample', week: weekLabel(previousWeek), completed: '完成了 C 指针专题练习，并把链表插入和删除各手写两遍。', blocked: '动态内存释放顺序还不稳定，调试时容易忽略悬空指针。', improve: '下周用 AddressSanitizer 复查三个小程序，再开始队列练习。', createdAt: previousWeek.toISOString() }
          ]
        };
      }

      function createEmptyData() {
        return { tasks: [], stages: createStages(false), notes: [], milestones: createMilestones(false), reviews: [] };
      }

      function validData(value) {
        return value && ['tasks', 'stages', 'notes', 'milestones', 'reviews'].every((key) => Array.isArray(value[key]));
      }

      function validDate(value) {
        return /^\d{4}-\d{2}-\d{2}$/.test(String(value || ''));
      }

      function normalizeData(value) {
        if (!validData(value)) return null;
        const stageDefaults = createStages(false);
        const milestoneDefaults = createMilestones(false);
        return {
          tasks: value.tasks.filter((task) => task && typeof task === 'object').map((task) => ({
            id: String(task.id || id('task')),
            title: String(UPDATED_SAMPLE_TASKS[task.title] || task.title || '').trim().slice(0, 100),
            priority: Object.hasOwn(PRIORITY_LABELS, task.priority) ? task.priority : 'medium',
            phase: PHASES.includes(task.phase) ? task.phase : 'P0',
            done: task.done === true,
            scheduledFor: validDate(task.scheduledFor) ? task.scheduledFor : (validDate(task.createdAt) ? task.createdAt : localDate()),
            createdAt: validDate(task.createdAt) ? task.createdAt : localDate(),
            completedAt: task.done && task.completedAt ? String(task.completedAt) : null
          })).filter((task) => task.title),
          stages: stageDefaults.map((fallback) => {
            const source = value.stages.find((stage) => stage && stage.id === fallback.id) || {};
            return {
              ...fallback,
              name: String(source.name || fallback.name),
              range: String(source.range || fallback.range),
              focus: String(!source.focus || LEGACY_STAGE_FOCUS.has(source.focus) ? fallback.focus : source.focus),
              progress: Math.max(0, Math.min(100, Number(source.progress) || 0)),
              progressMode: source.progressMode === 'manual' ? 'manual' : 'auto',
              next: String(!source.next || LEGACY_STAGE_NEXT.has(source.next) ? fallback.next : source.next).slice(0, 160)
            };
          }),
          notes: value.notes.filter((note) => note && typeof note === 'object').map((note) => ({
            id: String(note.id || id('note')),
            category: CATEGORIES.includes(note.category) ? note.category : '其他',
            phase: PHASES.includes(note.phase) ? note.phase : 'P0',
            content: String(note.content || '').trim().slice(0, 500),
            createdAt: String(note.createdAt || new Date().toISOString())
          })).filter((note) => note.content),
          milestones: milestoneDefaults.map((fallback) => {
            const source = value.milestones.find((milestone) => milestone && milestone.id === fallback.id) || {};
            return { ...fallback, passed: source.passed === true };
          }),
          reviews: value.reviews.filter((review) => review && typeof review === 'object').map((review) => ({
            id: String(review.id || id('review')),
            week: String(review.week || weekLabel()),
            completed: String(review.completed || '').trim().slice(0, 1000),
            blocked: String(review.blocked || '').trim().slice(0, 1000),
            improve: String(review.improve || '').trim().slice(0, 1000),
            createdAt: String(review.createdAt || new Date().toISOString())
          })).filter((review) => review.completed || review.blocked || review.improve)
        };
      }

      let state = normalizeData(store.get('data', null));
      if (!state) {
        state = createSeed();
        store.set('data', state);
      } else {
        store.set('data', state);
      }
      let timer = normalizeTimer(store.get('timer', null));

      const ui = {
        taskMode: 'today',
        taskPhase: 'all',
        taskPriority: 'all',
        noteCategory: 'all',
        editingReview: null

      function persist() {
        if (!store.set('data', state)) notify('保存失败，请导出备份后检查浏览器存储空间');
      }

      function id(prefix) {
        return prefix + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
      }

      function escapeHTML(value) {
        return String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;');
      }

      const PROTECTED_PROSE_TERMS = Object.freeze([
        '队列通信', '悬空指针', '比较值', '预分频', '不一定', '采样值', '定时器',
        '复盘', '清晰', '产生', '字节', '数组'
      ]);
      const PROSE_SELECTOR = '.view-description, .card-description, .task-title, .stage-focus, .note-content, .milestone-goal, .guide-section li, .review-section p, .empty-state span';

      function preserveProsePhrases(text) {
        return PROTECTED_PROSE_TERMS.reduce((result, term) => (
          result.replaceAll(term, Array.from(term).join('\u2060'))
        ), text);
      }

      function formatRenderedProse(root) {
        root.querySelectorAll(PROSE_SELECTOR).forEach((element) => {
          const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
          while (walker.nextNode()) {
            walker.currentNode.nodeValue = preserveProsePhrases(walker.currentNode.nodeValue);
          }
        });
      }

      function icon(name, extraClass = '') {
        return '<svg class="icon ' + extraClass + '" aria-hidden="true"><use href="#i-' + name + '"></use></svg>';
      }

      function categoryClass(category) {
        return { 'C语言': 'cat-c', 'STM32': 'cat-stm32', 'RTOS': 'cat-rtos', 'Linux': 'cat-linux', '电路': 'cat-circuit', '其他': 'cat-other' }[category] || 'cat-other';
      }

      function formatDateTime(value) {
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? '' : new Intl.DateTimeFormat('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }).format(date);
      }

      function displayDate() {
        return new Intl.DateTimeFormat('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' }).format(new Date());
      }

      function taskDateStatus(task) {
        if (task.done) return 'done';
        if (task.scheduledFor < localDate()) return 'overdue';
        if (task.scheduledFor === localDate()) return 'today';
        return 'upcoming';
      }

      function taskDateLabel(task) {
        const status = taskDateStatus(task);
        if (status === 'done') return { className: 'passed', text: '已完成 · ' + task.scheduledFor.slice(5) };
        if (status === 'overdue') return { className: 'overdue', text: '已逾期 · ' + task.scheduledFor.slice(5) };
        if (status === 'today') return { className: 'today', text: '今天' };
        return { className: '', text: task.scheduledFor.slice(5) };
      }

      function sortTasks(tasks) {
        return [...tasks].sort((a, b) => a.scheduledFor.localeCompare(b.scheduledFor) || PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority]);
      }

      function dueTasks() {
        return sortTasks(state.tasks.filter((task) => !task.done && task.scheduledFor <= localDate()));
      }

      function stageEvidence(stageId) {
        const tasks = state.tasks.filter((task) => task.phase === stageId);
        const milestones = state.milestones.filter((milestone) => milestone.phase === stageId);
        const completeTasks = tasks.filter((task) => task.done).length;
        const passedMilestones = milestones.filter((milestone) => milestone.passed).length;
        const taskRatio = tasks.length ? completeTasks / tasks.length : null;
        const milestoneRatio = milestones.length ? passedMilestones / milestones.length : null;
        let progress = 0;
        if (taskRatio !== null && milestoneRatio !== null) progress = Math.round((taskRatio * 0.7 + milestoneRatio * 0.3) * 100);
        else if (taskRatio !== null) progress = Math.round(taskRatio * 100);
        else if (milestoneRatio !== null) progress = Math.round(milestoneRatio * 100);
        return { tasks, milestones, completeTasks, passedMilestones, progress };
      }

      function stageProgress(stage) {
        return stage.progressMode === 'manual' ? stage.progress : stageEvidence(stage.id).progress;
      }

      function overallProgress() {
        const totalWeight = state.stages.reduce((sum, stage) => sum + stage.weight, 0);
        if (!totalWeight) return 0;
        return Math.round(state.stages.reduce((sum, stage) => sum + stageProgress(stage) * stage.weight, 0) / totalWeight);
      }

      function currentWeekCompletedTasks() {
        return state.tasks.filter((task) => task.done && task.completedAt && weekLabel(new Date(task.completedAt)) === weekLabel());
      }

      function weeklyTaskSummary() {
        const tasks = currentWeekCompletedTasks();
        return tasks.length ? tasks.map((task) => '完成：' + task.title + '（' + PHASE_LABELS[task.phase] + '）').join('\n') : '';
      }

      function requestedRoute() {
        return location.hash.replace(/^#\/?/, '').split('/')[0];
      }

      function route() {
        const key = requestedRoute();
        return ROUTES.includes(key) ? key : 'home';
      }

      function intro(kicker, title, description, context = '') {
        return '<header class="view-header">' +
          '<div class="view-heading"><p class="view-kicker">' + escapeHTML(kicker) + '</p><h1 class="view-title" id="view-title">' + escapeHTML(title) + '</h1><p class="view-description">' + escapeHTML(description) + '</p></div>' +
          '<div class="view-context">' + context + '</div></header>';
      }

      }

      function phaseOptions(selected, allLabel) {
        const all = allLabel ? '<option value="all"' + (selected === 'all' ? ' selected' : '') + '>' + escapeHTML(allLabel) + '</option>' : '';

      }

      function categoryOptions(selected, allLabel) {
        const all = allLabel ? '<option value="all"' + (selected === 'all' ? ' selected' : '') + '>' + escapeHTML(allLabel) + '</option>' : '';
        return all + CATEGORIES.map((category) => '<option value="' + escapeHTML(category) + '"' + (selected === category ? ' selected' : '') + '>' + escapeHTML(category) + '</option>').join('');
      }

      function taskRow(task, compact) {
        const title = escapeHTML(task.title);
        const date = taskDateLabel(task);
        const actions = compact ? '' : '<div class="row-actions"><button class="button icon-button ghost" type="button" data-action="edit-task" data-id="' + task.id + '" aria-label="编辑任务：' + title + '" title="编辑">' + icon('edit') + '</button><button class="button icon-button ghost danger" type="button" data-action="delete-task" data-id="' + task.id + '" aria-label="删除任务：' + title + '" title="删除">' + icon('trash') + '</button></div>';
        return '<li class="task-row' + (task.done ? ' is-done' : '') + '">' +
          '<label class="task-check"><input type="checkbox" data-action="toggle-task" data-id="' + task.id + '" aria-label="' + (task.done ? '恢复为未完成：' : '完成任务：') + title + '"' + (task.done ? ' checked' : '') + '><span aria-hidden="true"></span></label>' +
          '<div class="task-main"><span class="task-title">' + title + '</span><div class="task-meta"><span class="tag phase">' + escapeHTML(PHASE_LABELS[task.phase]) + '</span><span class="tag ' + task.priority + '">' + PRIORITY_LABELS[task.priority] + '优先级</span><span class="tag ' + date.className + '">' + escapeHTML(date.text) + '</span></div></div>' + actions + '</li>';
      }

          '<div class="home-grid"><section class="card today-card" aria-labelledby="today-title"><div class="card-header"><div><h2 class="section-title" id="today-title">今天要做什么</h2><p class="card-description">' + openTasks.length + ' 项待完成' + (overdueCount ? ' · ' + overdueCount + ' 项逾期' : '') + '</p></div><a class="button small ghost" href="#/focus">' + icon('timer') + '开始专注</a></div><form class="quick-form" data-form="home-task"><label class="sr-only" for="home-task-title">新增今日任务</label><input class="field grow" id="home-task-title" name="title" required maxlength="100" placeholder="今天准备完成什么？"><button class="button primary" type="submit" aria-label="添加到今天">' + icon('plus') + '添加</button></form><div style="margin-top:var(--space-3)">' + taskList + '</div><div class="today-actions"><a class="button small ghost" href="#/tasks">查看全部任务' + icon('arrow') + '</a></div></section>' +
          '<div class="side-stack"><article class="card"><div class="progress-summary"><div><p class="view-kicker">整体学习进度</p><h2 class="card-title">当前阶段：' + escapeHTML(stage ? PHASE_LABELS[stage.id] : '尚未开始') + '</h2></div><span class="progress-value">' + overall + '%</span></div><p class="card-description">综合五个阶段的路线权重、任务完成情况和自测结果。</p><div class="progress-track" role="progressbar" aria-label="整体学习进度" aria-valuenow="' + overall + '" aria-valuemin="0" aria-valuemax="100"><span class="progress-fill" style="--progress:' + overall + '%"></span></div><div style="margin-top:var(--space-4)"><a class="support-link" href="#/stages"><span>查看进度如何计算</span>' + icon('arrow') + '</a></div></article>' + targetCard + '</div></div>' +

      }

      function renderFocus() {
        const mode = TIMER_MODES[timer.mode];

      }

      function renderTasks() {

            '<div class="stage-body"><div class="progress-track" role="progressbar" aria-label="' + escapeHTML(stage.name) + '阶段完成度" aria-valuenow="' + progress + '" aria-valuemin="0" aria-valuemax="100"><span class="progress-fill" style="--progress:' + progress + '%"></span></div><div class="stage-evidence" aria-label="阶段进度依据及记录"><span>任务 <strong>' + evidence.completeTasks + '/' + evidence.tasks.length + '</strong> 完成</span><span>自测 <strong>' + evidence.passedMilestones + '/' + evidence.milestones.length + '</strong> 通过</span><span>笔记 <strong>' + notes.length + '</strong> 条</span></div><p class="stage-focus">' + escapeHTML(stage.focus) + '</p>' +
            '<section class="stage-tool"><h3>下一步行动</h3><form class="next-form" data-form="stage-next" data-id="' + stage.id + '"><label class="sr-only" for="next-' + stage.id + '">' + escapeHTML(stage.name) + '下一步行动</label><textarea class="field" id="next-' + stage.id + '" name="next" maxlength="160" rows="3">' + escapeHTML(stage.next) + '</textarea><div class="next-action-buttons"><button class="button" type="submit">保存计划</button><button class="button primary" type="button" data-action="add-stage-next-task" data-id="' + stage.id + '">添加到今天任务</button></div></form><p class="stage-tool-help">修改后先保存计划，再添加到今天任务。</p></section>' +
            '<details id="stage-settings-' + stage.id + '" class="stage-details"' + (settingsOpen ? ' open' : '') + '><summary>进度设置 · ' + (manual ? '手动设置' : '自动计算') + '</summary><p class="stage-tool-help">' + progressHelp + '</p>' + manualControls + '<button class="button small ghost stage-mode-button" type="button" data-action="toggle-stage-mode" data-id="' + stage.id + '">' + (manual ? '恢复自动计算' : '改为手动设置') + '</button></details></div></details>';
        }).join('');
        return '<div class="view-inner">' + intro('路线推进', '阶段进度', '从当前阶段的下一步开始，其他阶段可展开查看。', '<span class="date-chip">' + state.stages.filter((stage) => stageProgress(stage) === 100).length + '/' + state.stages.length + ' 阶段完成</span>') + '<section class="stage-overview card"><div class="stage-overview-main"><h2>整体进度</h2><strong class="stage-overview-value">' + overall + '%</strong></div><div><div class="progress-track" role="progressbar" aria-label="整体学习进度" aria-valuenow="' + overall + '" aria-valuemin="0" aria-valuemax="100"><span class="progress-fill" style="--progress:' + overall + '%"></span></div><p class="stage-overview-note">按各阶段的路线权重计算，不代表固定的日历周期。</p></div></section><section class="stage-list" aria-label="学习阶段，当前阶段优先">' + cards + '</section></div>';
      }

      function renderNotes() {
        const notes = state.notes.filter((note) => ui.noteCategory === 'all' || note.category === ui.noteCategory);
        const cards = notes.length ? '<div class="note-grid">' + notes.map((note) => { const label = escapeHTML(note.content.slice(0, 24)); return '<article class="card note-card"><div class="card-header"><div class="meta-row"><span class="tag ' + categoryClass(note.category) + '">' + escapeHTML(note.category) + '</span><span class="tag phase">' + escapeHTML(PHASE_LABELS[note.phase]) + '</span></div><div class="row-actions"><button class="button icon-button ghost" type="button" data-action="edit-note" data-id="' + note.id + '" aria-label="编辑笔记：' + label + '" title="编辑">' + icon('edit') + '</button><button class="button icon-button ghost danger" type="button" data-action="delete-note" data-id="' + note.id + '" aria-label="删除笔记：' + label + '" title="删除">' + icon('trash') + '</button></div></div><p class="note-content">' + escapeHTML(note.content) + '</p><footer class="note-footer"><span>' + escapeHTML(formatDateTime(note.createdAt)) + '</span></footer></article>'; }).join('') + '</div>' : emptyState('这个分类还没有笔记', '从上方快速记录一个结论、现象或易错点。', 'notes');
        return '<div class="view-inner">' + intro('学习记录', '知识笔记', '把刚学会的结论、实验现象或错误原因写下来。分类和阶段会保存到笔记上，方便之后查找。', '<span class="date-chip">' + state.notes.length + ' 条记录</span>') + '<section class="card" style="margin-bottom:var(--space-4)"><div class="form-section-heading"><h2>新建知识笔记</h2><p>用一两句话写清现象和结论；分类表示内容主题，学习阶段表示它属于哪段路线。</p></div><form class="note-create-form" data-form="note"><label class="field-label" for="note-category">内容分类<select class="field" id="note-category" name="category">' + categoryOptions('C语言') + '</select></label><label class="field-label" for="note-phase">属于哪个学习阶段<select class="field" id="note-phase" name="phase">' + phaseOptions(currentStage()?.id || 'P0') + '</select></label><label class="field-label wide" for="note-content">笔记内容<input class="field" id="note-content" name="content" required maxlength="500" placeholder="例如：按键引脚悬空会出现随机电平，需要配置上拉或下拉"></label><button class="button primary" type="submit">' + icon('plus') + '保存笔记</button></form><div class="task-filter-area"><div class="form-section-heading"><h2>查看已有笔记</h2><p>这里的选择只会筛选列表，不会修改已经保存的笔记。</p></div><div class="filter-cluster"><label class="field-label" for="note-filter">只看某个分类<select class="field" id="note-filter" data-filter="note-category">' + categoryOptions(ui.noteCategory, '所有分类') + '</select></label></div></div></section>' + cards + '</div>';
      }

      function renderMilestones() {
        const target = state.milestones.find((milestone) => !milestone.passed);
        const cards = state.milestones.length ? '<div class="milestone-list">' + state.milestones.map((milestone) => {
          const isTarget = target && target.id === milestone.id;
          const steps = milestone.steps.map((step) => '<li>' + escapeHTML(step) + '</li>').join('');
          const checks = milestone.checks.map((check) => '<li>' + escapeHTML(check) + '</li>').join('');
          return '<article class="card milestone-card' + (milestone.passed ? ' passed' : '') + (isTarget ? ' target' : '') + '"><div class="card-header"><div><div class="meta-row"><span class="milestone-code">' + escapeHTML(milestone.id) + '</span><span class="tag phase">' + escapeHTML(PHASE_LABELS[milestone.phase]) + '</span><span class="tag">建议在' + escapeHTML(milestone.month) + '完成</span>' + (isTarget ? '<span class="tag current">当前要完成</span>' : '') + '</div><h2 class="card-title">' + escapeHTML(milestone.title) + '</h2></div><span class="tag ' + (milestone.passed ? 'passed' : '') + '">' + (milestone.passed ? '已通过' : '未通过') + '</span></div><p class="milestone-goal"><strong>自测目标：</strong>' + escapeHTML(milestone.goal) + '</p><details class="milestone-details"' + (isTarget ? ' open' : '') + '><summary>' + (isTarget ? '当前自测的操作步骤和通过标准' : '查看操作步骤和通过标准') + '</summary><div class="milestone-guide"><section class="guide-section"><h3>按这 3 步操作</h3><ol>' + steps + '</ol></section><section class="guide-section"><h3>满足以下条件才算通过</h3><ul>' + checks + '</ul></section></div></details><button class="button ' + (milestone.passed ? 'ghost' : 'primary') + '" type="button" data-action="toggle-milestone" data-id="' + milestone.id + '">' + icon(milestone.passed ? 'reset' : 'check') + (milestone.passed ? '重新标记为未通过' : '我已完成并检查以上标准') + '</button></article>';
        }).join('') + '</div>' : emptyState('暂无里程碑', '重置示例数据可恢复路线检查点。', 'milestone');
        return '<div class="view-inner">' + intro('阶段验收', '里程碑自测', '按步骤完成实验，再逐条核对通过标准。不要因为“看懂了”就标记通过，必须能独立操作并验证结果。', '<span class="date-chip">' + state.milestones.filter((item) => item.passed).length + '/' + state.milestones.length + ' 已通过</span>') + cards + '</div>';
      }

      function renderReview() {
        const currentReview = state.reviews.find((review) => review.week === weekLabel());
        const editing = state.reviews.find((review) => review.id === ui.editingReview) || currentReview;
        const evidence = currentWeekCompletedTasks();
        const history = state.reviews.length ? '<div class="review-history">' + state.reviews.map((review) => '<article class="card"><div class="card-header"><div><p class="view-kicker">' + escapeHTML(review.week) + '</p><h2 class="card-title">周复盘记录</h2></div><div class="row-actions"><button class="button icon-button ghost" type="button" data-action="edit-review" data-id="' + review.id + '" aria-label="编辑 ' + escapeHTML(review.week) + ' 复盘" title="编辑">' + icon('edit') + '</button><button class="button icon-button ghost danger" type="button" data-action="delete-review" data-id="' + review.id + '" aria-label="删除 ' + escapeHTML(review.week) + ' 复盘" title="删除">' + icon('trash') + '</button></div></div><div class="review-section"><strong>本周完成了什么？</strong><p>' + escapeHTML(review.completed) + '</p></div><div class="review-section"><strong>卡在哪里？</strong><p>' + escapeHTML(review.blocked) + '</p></div><div class="review-section"><strong>下周怎么改？</strong><p>' + escapeHTML(review.improve) + '</p></div></article>').join('') + '</div>' : emptyState('还没有复盘记录', '填写左侧三个问题，保存第一条本周复盘。', 'review');
        const formWeek = editing?.week || weekLabel();
        const isCurrent = formWeek === weekLabel();
        return '<div class="view-inner">' + intro('周度校准', '每周复盘', '用真实完成记录作为依据，再写下阻塞和下一步调整。每周只保留一条复盘。', '<span class="date-chip">' + escapeHTML(weekLabel()) + '</span>') + '<div class="review-layout"><section class="card"><div class="card-header"><div><h2 class="card-title">' + (editing ? (isCurrent ? '更新本周复盘' : '编辑历史复盘') : '填写本周复盘') + '</h2><p class="card-description">' + escapeHTML(formWeek) + '</p></div></div><form class="review-form" data-form="review"><div class="review-evidence"><p>本周已完成 <strong>' + evidence.length + '</strong> 项任务，可直接作为复盘依据。</p><button class="button small ghost" type="button" data-action="fill-weekly-completed"' + (evidence.length ? '' : ' disabled') + '>带入完成记录</button></div><label class="form-label" for="review-completed">本周完成了什么？<textarea class="field" id="review-completed" name="completed" required maxlength="1000" placeholder="写下完成的任务、实验或理解">' + escapeHTML(editing?.completed || '') + '</textarea></label><label class="form-label" for="review-blocked">卡在哪里？<textarea class="field" id="review-blocked" name="blocked" required maxlength="1000" placeholder="记录最具体的阻塞点">' + escapeHTML(editing?.blocked || '') + '</textarea></label><label class="form-label" for="review-improve">下周怎么改？<textarea class="field" id="review-improve" name="improve" required maxlength="1000" placeholder="给出一个可执行的调整">' + escapeHTML(editing?.improve || '') + '</textarea></label><div class="review-actions">' + (ui.editingReview ? '<button class="button ghost" type="button" data-action="cancel-review">取消编辑</button>' : '') + '<button class="button primary" type="submit">' + icon('check') + (editing ? '保存修改' : '保存复盘') + '</button></div></form></section><section><h2 class="section-title">历史记录</h2>' + history + '</section></div></div>';
      }

      const renderers = { home: renderHome, tasks: renderTasks, stages: renderStages, notes: renderNotes, milestones: renderMilestones, review: renderReview, focus: renderFocus };
      const pageNames = { home: '首页', tasks: '学习任务', stages: '阶段进度', notes: '知识笔记', milestones: '里程碑', review: '每周复盘', focus: '番茄钟' };

      function render() {
        const currentRoute = route();
        const view = document.getElementById('view');
        view.innerHTML = renderers[currentRoute]();
        formatRenderedProse(view);
        document.querySelectorAll('[data-route]').forEach((link) => {
          if (link.dataset.route === currentRoute) link.setAttribute('aria-current', 'page');
          else link.removeAttribute('aria-current');
        });
        const moreNav = document.querySelector('.mobile-more-nav');
        moreNav.classList.toggle('is-current', currentRoute === 'milestones' || currentRoute === 'review' || currentRoute === 'focus');
        updateTimerView();
        document.title = pageNames[currentRoute] + ' | 嵌入式学习工作台';
      }

      function updateTimerView() {
        if (route() !== 'focus') return;
        const mode = TIMER_MODES[timer.mode];
        const time = document.getElementById('focus-time');
        const stateText = document.getElementById('focus-state');
        const status = document.getElementById('focus-status');
        const toggle = document.querySelector('[data-action="timer-toggle"]');
        if (time) time.textContent = formatTimer(timer.remaining);
        if (stateText) stateText.textContent = timer.running ? (timer.mode === 'focus' ? '专注进行中，把注意力留给当前任务。' : '休息进行中，离开屏幕放松一下。') : (timer.remaining === 0 ? '本轮已结束，可以开始下一轮。' : '准备好后开始计时。');
        if (toggle) {
          toggle.innerHTML = icon(timer.running ? 'pause' : 'play') + (timer.running ? '暂停计时' : (timer.remaining === 0 ? '重新开始' : '开始计时'));
        }
        if (status) status.textContent = '当前模式：' + mode.label + ' · 已完成 ' + timer.sessions + ' 个专注回合';
      }

      function advanceTimer() {
        if (!timer.running) return;
        const now = Date.now();
        if (!Number.isFinite(timer.endsAt)) timer.endsAt = now + timer.remaining * 1000;
        const remaining = Math.max(0, Math.ceil((timer.endsAt - now) / 1000));
        if (remaining === timer.remaining && remaining > 0) return;
        timer.remaining = remaining;
        timer.updatedAt = now;
        if (timer.remaining === 0) {
          timer.running = false;
          timer.endsAt = null;
          if (timer.mode === 'focus') timer.sessions += 1;
          notify(timer.mode === 'focus' ? '专注时间结束，休息一下' : '休息结束，准备开始下一轮');
        }
        persistTimer();
        updateTimerView();
      }

      function setTimerMode(mode) {
        if (!TIMER_MODES[mode]) return;
        timer = createTimer(mode);
        persistTimer();
        render();
      }

      function toggleTimer() {
        const now = Date.now();
        if (timer.running) {
          advanceTimer();
          if (!timer.running) return;
          timer.running = false;
          timer.endsAt = null;
        } else {
          if (timer.remaining === 0) timer.remaining = TIMER_MODES[timer.mode].seconds;
          timer.running = true;
          timer.endsAt = now + timer.remaining * 1000;
        }
        timer.updatedAt = now;
        persistTimer();
        updateTimerView();
      }

      function resetTimer() {
        timer = createTimer(timer.mode);
        persistTimer();
        render();
      }

      function notify(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
      }

      function addTask(title, priority, phase, scheduledFor = localDate()) {
        state.tasks.unshift({ id: id('task'), title: title.trim(), priority, phase, done: false, scheduledFor, createdAt: localDate(), completedAt: null });
        persist();
      }

      function addNote(content, category, phase) {
        state.notes.unshift({ id: id('note'), category, phase, content: content.trim(), createdAt: new Date().toISOString() });
        persist();
      }

      function openEditor(kind, item) {
        const dialog = document.getElementById('edit-dialog');
        const form = dialog.querySelector('form');
        form.reset();
        form.elements.kind.value = kind;
        form.elements.id.value = item.id;
        form.querySelectorAll('[data-edit-section]').forEach((section) => {
          const active = section.dataset.editSection === kind;
          section.hidden = !active;
          section.querySelectorAll('input, select, textarea').forEach((field) => { field.disabled = !active; });
        });
        if (kind === 'task') {
          document.getElementById('edit-dialog-title').textContent = '编辑任务';
          form.elements['task-title'].value = item.title;
          form.elements['task-priority'].value = item.priority;
          form.elements['task-phase'].value = item.phase;
          form.elements['task-date'].value = item.scheduledFor;
        } else {
          document.getElementById('edit-dialog-title').textContent = '编辑笔记';
          form.elements['note-content'].value = item.content;
          form.elements['note-category'].value = item.category;
          form.elements['note-phase'].value = item.phase;
        }
        dialog.showModal();
        form.querySelector('[data-edit-section="' + kind + '"] .field').focus();
      }

      function closeEditor() {
        const dialog = document.getElementById('edit-dialog');
        if (dialog.open) dialog.close();
      }

      function exportData() {
        const payload = { app: 'embedded-learning-workbench', version: DATA_VERSION, exportedAt: new Date().toISOString(), data: state, timer };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'embedded-workbench-' + localDate() + '.json';
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 0);
        notify('备份已导出');
      }

      async function importData(file) {
        try {
          if (!file || file.size > 2 * 1024 * 1024) throw new Error('文件无效');
          const payload = JSON.parse(await file.text());
          const nextState = normalizeData(payload?.data || payload);
          if (!nextState) throw new Error('格式无效');
          if (!window.confirm('导入将覆盖当前工作台数据。建议先导出当前备份，确定继续？')) return;
          state = nextState;
          timer = normalizeTimer(payload?.timer || null);
          persistTimer();
          persist();
          ui.editingReview = null;
          render();
          notify('备份已导入');
        } catch (error) {
          notify('导入失败：请选择本工作台导出的 JSON 备份');
        } finally {
          document.getElementById('data-import').value = '';
        }
      }

      function syncTheme() {
        const theme = document.documentElement.dataset.theme;
        document.querySelectorAll('[data-theme-label]').forEach((label) => { label.textContent = theme === 'dark' ? '切换浅色' : '切换深色'; });
        document.querySelectorAll('[data-action="toggle-theme"]').forEach((button) => button.setAttribute('aria-label', theme === 'dark' ? '切换浅色主题' : '切换深色主题'));
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#14161a' : '#f5f4ef');
      }

      document.addEventListener('submit', (event) => {
        const form = event.target.closest('[data-form]');
        if (!form) return;
        event.preventDefault();
        const values = new FormData(form);
        if (form.dataset.form === 'edit-item') {
          const kind = values.get('kind');
          if (kind === 'task') {
            const task = state.tasks.find((item) => item.id === values.get('id'));
            if (task) {
              task.title = String(values.get('task-title')).trim();
              task.priority = values.get('task-priority');
              task.phase = values.get('task-phase');
              task.scheduledFor = values.get('task-date');
            }
          }
          if (kind === 'note') {
            const note = state.notes.find((item) => item.id === values.get('id'));
            if (note) {
              note.content = String(values.get('note-content')).trim();
              note.category = values.get('note-category');
              note.phase = values.get('note-phase');
            }
          }
          persist();
          closeEditor();
          notify(kind === 'task' ? '任务已更新' : '笔记已更新');
        }
        if (form.dataset.form === 'home-task') {
          addTask(values.get('title'), 'medium', currentStage()?.id || 'P0');
          notify('任务已添加');
        }
        if (form.dataset.form === 'task') {
          addTask(values.get('title'), values.get('priority'), values.get('phase'), values.get('scheduledFor'));
          notify('任务已添加');
        }
        if (form.dataset.form === 'home-note') {
          addNote(values.get('content'), '其他', currentStage()?.id || 'P0');
          notify('笔记已保存');
        }
        if (form.dataset.form === 'note') {
          addNote(values.get('content'), values.get('category'), values.get('phase'));
          notify('笔记已保存');
        }
        if (form.dataset.form === 'stage-next') {
          const stage = state.stages.find((item) => item.id === form.dataset.id);
          if (stage) {
            stage.next = String(values.get('next')).trim();
            persist();
            notify('下一步行动已更新');
          }
        }
        if (form.dataset.form === 'review') {
          const existing = ui.editingReview ? state.reviews.find((item) => item.id === ui.editingReview) : state.reviews.find((item) => item.week === weekLabel());
          const review = {
            id: existing?.id || id('review'),
            week: existing?.week || weekLabel(),
            completed: String(values.get('completed')).trim(),
            blocked: String(values.get('blocked')).trim(),
            improve: String(values.get('improve')).trim(),
            createdAt: new Date().toISOString()
          };
          if (existing) state.reviews = state.reviews.map((item) => item.id === existing.id ? review : item);
          else state.reviews.unshift(review);
          ui.editingReview = null;
          persist();
          notify('复盘已保存');
        }
        form.reset();
        render();
      });

      document.addEventListener('change', (event) => {
        const target = event.target;
        if (target.matches('[data-action="toggle-task"]')) {
          const task = state.tasks.find((item) => item.id === target.dataset.id);
          if (task) {
            task.done = target.checked;
            task.completedAt = task.done ? new Date().toISOString() : null;
            persist();
            notify(task.done ? '任务已完成' : '任务已恢复');
            render();
          }
        }
        if (target.matches('[data-filter="task-phase"]')) { ui.taskPhase = target.value; render(); }
        if (target.matches('[data-filter="task-priority"]')) { ui.taskPriority = target.value; render(); }
        if (target.matches('[data-filter="note-category"]')) { ui.noteCategory = target.value; render(); }
        if (target.matches('[data-stage-range]')) {
          const stage = state.stages.find((item) => item.id === target.dataset.stageRange);
          if (stage) {
            stage.progress = Number(target.value);
            stage.progressMode = 'manual';
            persist();
            notify(stage.id + ' 进度已更新');
            render();
          }
        }
      });

      document.addEventListener('click', (event) => {
        const control = event.target.closest('[data-action]');
        if (!control) return;
        const action = control.dataset.action;
        if (action === 'toggle-theme') {
          const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
          document.documentElement.dataset.theme = next;
          store.set('theme', next);
          syncTheme();
          notify(next === 'dark' ? '已切换深色主题' : '已切换浅色主题');
        }
        if (action === 'toggle-sidebar') {
          const collapsed = !document.body.classList.contains('sidebar-collapsed');
          document.body.classList.toggle('sidebar-collapsed', collapsed);
          store.set('sidebar-collapsed', collapsed);
          control.setAttribute('aria-label', collapsed ? '展开侧栏' : '折叠侧栏');
          control.title = collapsed ? '展开侧栏' : '折叠侧栏';
        }
        if (action === 'close-dialog') closeEditor();
        if (action === 'export-data') exportData();
        if (action === 'import-data') document.getElementById('data-import').click();
        if (action === 'task-mode') { ui.taskMode = control.dataset.mode; render(); }
        if (action === 'timer-mode') setTimerMode(control.dataset.mode);
        if (action === 'timer-toggle') toggleTimer();
        if (action === 'timer-reset') resetTimer();
        if (action === 'edit-task') {
          const task = state.tasks.find((item) => item.id === control.dataset.id);
          if (task) openEditor('task', task);
        }
        if (action === 'delete-task') {
          const task = state.tasks.find((item) => item.id === control.dataset.id);
          if (task && window.confirm('删除任务“' + task.title + '”？')) { state.tasks = state.tasks.filter((item) => item.id !== task.id); persist(); render(); notify('任务已删除'); }
        }
        if (action === 'adjust-stage') {
          const stage = state.stages.find((item) => item.id === control.dataset.id);
          if (stage && stage.progressMode === 'manual') { stage.progress = Math.max(0, Math.min(100, stage.progress + Number(control.dataset.delta))); persist(); render(); notify(stage.id + ' 进度已更新'); }
        }
        if (action === 'toggle-stage-mode') {
          const stage = state.stages.find((item) => item.id === control.dataset.id);
          if (stage) {
            if (stage.progressMode === 'manual') stage.progressMode = 'auto';
            else { stage.progress = stageProgress(stage); stage.progressMode = 'manual'; }
            persist();
            render();
            notify(stage.id + (stage.progressMode === 'auto' ? ' 已恢复自动计算' : ' 已改为手动设置'));
          }
        }
        if (action === 'add-stage-next-task') {
          const stage = state.stages.find((item) => item.id === control.dataset.id);
          const title = stage?.next.trim();
          if (stage && title) {
            const exists = state.tasks.some((task) => !task.done && task.phase === stage.id && task.title === title);
            if (exists) notify('这项行动已经在未完成任务中');
            else { addTask(title, 'medium', stage.id, localDate()); render(); notify('已添加到今天任务'); }
          }
        }
        if (action === 'edit-note') {
          const note = state.notes.find((item) => item.id === control.dataset.id);
          if (note) openEditor('note', note);
        }
        if (action === 'delete-note') {
          if (window.confirm('删除这条笔记？')) { state.notes = state.notes.filter((item) => item.id !== control.dataset.id); persist(); render(); notify('笔记已删除'); }
        }
        if (action === 'toggle-milestone') {
          const milestone = state.milestones.find((item) => item.id === control.dataset.id);
          if (milestone) { milestone.passed = !milestone.passed; persist(); render(); notify(milestone.passed ? milestone.id + ' 已通过' : milestone.id + ' 已恢复为未通过'); }
        }
        if (action === 'fill-weekly-completed') {
          const field = document.getElementById('review-completed');
          const summary = weeklyTaskSummary();
          if (field && summary) { field.value = field.value.trim() ? field.value.trim() + '\n' + summary : summary; field.focus(); notify('已带入本周完成记录'); }
        }
        if (action === 'edit-review') { ui.editingReview = control.dataset.id; render(); document.querySelector('.workspace').scrollTo({ top: 0, behavior: 'smooth' }); }
        if (action === 'cancel-review') { ui.editingReview = null; render(); }
        if (action === 'delete-review') {
          if (window.confirm('删除这条复盘记录？')) { state.reviews = state.reviews.filter((item) => item.id !== control.dataset.id); if (ui.editingReview === control.dataset.id) ui.editingReview = null; persist(); render(); notify('复盘已删除'); }
        }
        if (action === 'reset-data' && window.confirm('用初始示例数据覆盖当前工作台数据？')) {
          state = createSeed();
          timer = createTimer();
          persist();
          persistTimer();
          ui.editingReview = null;
          render();
          notify('示例数据已重置');
        }
        if (action === 'clear-data' && window.confirm('清空任务、笔记、进度、里程碑状态和复盘记录？')) {
          state = createEmptyData();
          timer = createTimer();
          persist();
          persistTimer();
          ui.editingReview = null;
          render();
          notify('工作台数据已清空');
        }
      });

      document.getElementById('data-import').addEventListener('change', (event) => importData(event.target.files[0]));
      window.setInterval(advanceTimer, 250);

      window.addEventListener('hashchange', () => {
        render();
        document.querySelector('.workspace').scrollTop = 0;
        document.querySelectorAll('.mobile-more-nav, .mobile-settings').forEach((details) => { details.open = false; });
      });
      if (!ROUTES.includes(requestedRoute())) history.replaceState(null, '', '#/home');
      document.body.classList.toggle('sidebar-collapsed', store.get('sidebar-collapsed', false) === true);
      syncTheme();
      render();
    }());
  </script>
</body>
</html>
